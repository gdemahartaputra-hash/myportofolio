{% extends 'base.html' %}
{% block content %}    
    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Information System &middot; Universitas Indonesia</p>
                    <h1>{{ name }}</h1>
                </div>
                <div class="hero-photo">
                    <div class="photo-block"></div>
                    <img class="avatar" src="/static/img/putra.png" alt="Photo of {{ name }}">
                </div>
                <div></div>
                <div class="cvsection">
                    <a href="https://docs.google.com/document/d/1DmsJMZe7X_2F-IUbmRyVfrWiSp9EQXHlRNPu_ahPw9Q/edit?usp=sharing" class="cv-link" target="_blank">
                        View CV
                    </a>
                </div>
                
                <div class="hero-details">
                    <p class="bio">{{ bio }}</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/gdemahartaputra-hash" class="social-link">GitHub</a>
                        <a href="https://linkedin.com/in/gde-maharta-putra-wicaksana-ridjasa-8b631428b" class="social-link">LinkedIn</a>
                        <a href="mailto:gde.maharta.putra@gmail.com" class="social-link">Email</a>
                    </div>
                </div>
            </div>
        </section>
        
    </main>
{% endblock content %}
